name: backend-db

# ADR-0004 §9: PostgreSQL è il database applicativo unico (target).
# SQLite resta solo per i test del converter legacy (ADR-0004 §1).
# F1-05a (#499, ADR-0003 §5.2): suite backend su Postgres e SQLite.
# Only on PRs touching the backend or these checks, or by hand; never on every push of main.
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Optional full commit SHA: repeat Postgres on that revision with only the CI harness overlaid'
        type: string
        default: ''
  pull_request:
    paths:
      - backend/**
      - scripts/check-sql-portability.py
      - scripts/sql-portability-exceptions.txt
      - .github/workflows/backend-db.yml

permissions:
  contents: read

concurrency:
  group: backend-db-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  OLLAMA_PRELOAD: 'false'

jobs:
  tests-postgres:
    name: tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.baseline_ref != '' && '["postgres", "postgres baseline"]' || '["postgres"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: c5_test
          POSTGRES_DB: counselorbot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['18650:5432']
        options: >-
          --health-cmd "pg_isready -U c5_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The URL several suites assert on (they refuse any other database).
      DATABASE_URL: postgresql://c5_test@127.0.0.1:18650/counselorbot_test
      TEST_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the optional pre-F1-05a Postgres control
        if: matrix.target == 'postgres baseline'
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          [[ "$BASELINE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch --depth=1 origin "$BASELINE_REF"
          baseline="$RUNNER_TEMP/baseline"
          mkdir -p "$baseline"
          git archive FETCH_HEAD | tar -x -C "$baseline"
          # Keep the original application, fixture and tests. Overlay only the
          # failure recorder/key isolation and the four existing URL-guard fixes.
          for file in conftest.py postgres_known_failures.txt test_institute_credentials.py \
            test_institute_credentials_migration.py test_institution_password_display_migration.py \
            test_teacher_institutes.py; do
            cp "backend/tests/$file" "$baseline/backend/tests/$file"
          done
          echo "TEST_ROOT=$baseline" >> "$GITHUB_ENV"
          echo "Postgres control source: $BASELINE_REF; CI harness: $(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends graphviz fonts-inter tesseract-ocr-ita tesseract-ocr-eng && pip install -r backend/requirements.txt
      - name: Backend suite on Postgres with the ratchet (backend/tests/postgres_known_failures.txt)
        run: |
          cd "${TEST_ROOT:-$GITHUB_WORKSPACE}"
          export PYTHONPATH="$PWD"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
          export DATA_DIR="$RUNNER_TEMP/data" SESSION_MEMORY_DIR="$RUNNER_TEMP/memory"
          python -m pytest backend/tests -q -p no:cacheprovider -W ignore::DeprecationWarning \
            --strict-known-failures --junitxml="$RUNNER_TEMP/postgres-results.xml" \
            --failures-out "$RUNNER_TEMP/postgres-failures.txt"
      - name: Upload the current Postgres failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-failures
          path: |
            ${{ runner.temp }}/postgres-failures.txt
            ${{ runner.temp }}/postgres-results.xml
          if-no-files-found: error

  tests-sqlite:
    name: tests (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEST_DB: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends graphviz fonts-inter tesseract-ocr-ita tesseract-ocr-eng && pip install -r backend/requirements.txt
      - name: Backend suite on SQLite with the ratchet (backend/tests/sqlite_known_failures.txt)
        run: |
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/backend.sqlite3" DATA_DIR="$RUNNER_TEMP/data" SESSION_MEMORY_DIR="$RUNNER_TEMP/memory"
          python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"
          python -m pytest backend/tests -q -p no:cacheprovider -W ignore::DeprecationWarning \
            --strict-known-failures --junitxml="$RUNNER_TEMP/sqlite-results.xml" \
            --failures-out "$RUNNER_TEMP/sqlite-failures.txt"
      - name: Upload the current SQLite failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-failures
          path: |
            ${{ runner.temp }}/sqlite-failures.txt
            ${{ runner.temp }}/sqlite-results.xml
          if-no-files-found: error

  startup-postgres:
    name: startup (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ADR-0004 §9 gate 1: primo avvio PostgreSQL, doppio avvio, health contratto 2.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: c5_test
          POSTGRES_DB: counselorbot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['18651:5432']
        options: >-
          --health-cmd "pg_isready -U c5_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://c5_test@127.0.0.1:18651/counselorbot_test
      TEST_DB: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Start the backend twice on the same PostgreSQL database
        run: |
          data="$RUNNER_TEMP/cb"
          export DATA_DIR="$data/uploads" SESSION_MEMORY_DIR="$data/sessions" \
            RAG_INDEX_DIR="$data/rag" PERSONAL_API_CREDENTIALS_DIR="$data/credentials" STRATEGY_MEMORY_FILE="$data/strategy_memory.json"
          mkdir -p "$data"
          for run in 1 2; do
            python -m uvicorn backend.main:app --host 127.0.0.1 --port 8766 > "$data/pg-run$run.log" 2>&1 &
            pid=$!
            code=000
            for _ in $(seq 1 120); do
              kill -0 "$pid" 2>/dev/null || break
              code=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8766/health || true)
              [ "$code" = 200 ] && break
              sleep 2
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "run $run: GET /health -> $code"
            if [ "$code" != 200 ]; then
              tail -n 60 "$data/pg-run$run.log"
              exit 1
            fi
            # Verifica contratto 2 (ADR-0004 §5.3)
            contract=$(curl --max-time 2 -s http://127.0.0.1:8766/health | python3 -c "import json,sys; print(json.load(sys.stdin).get('desktop_contract', 0))" 2>/dev/null || echo "0")
            echo "run $run: desktop_contract -> $contract"
            if [ "$run" = 1 ] && [ "$contract" != 2 ]; then
              echo "ERRORE: contratto atteso 2, trovato $contract"
              exit 1
            fi
          done
      - name: Upload isolated PostgreSQL startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-startup
          path: ${{ runner.temp }}/cb/pg-run*.log
          if-no-files-found: error

  startup-sqlite:
    name: startup (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ADR-0004 §1: SQLite resta solo per test converter legacy.
    # Both runs must serve HTTP: any startup failure blocks CI (ADR-0003, F1-05c).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Start the backend twice on the same SQLite file
        run: |
          data="$RUNNER_TEMP/cb"
          export DATABASE_URL="sqlite:///$data/cb.sqlite3" DATA_DIR="$data/uploads" SESSION_MEMORY_DIR="$data/sessions" \
            RAG_INDEX_DIR="$data/rag" PERSONAL_API_CREDENTIALS_DIR="$data/credentials" STRATEGY_MEMORY_FILE="$data/strategy_memory.json"
          mkdir -p "$data"
          for run in 1 2; do
            python -m uvicorn backend.main:app --host 127.0.0.1 --port 8765 > "$data/run$run.log" 2>&1 &
            pid=$!
            code=000
            for _ in $(seq 1 120); do
              kill -0 "$pid" 2>/dev/null || break
              code=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/health || true)
              # 404 = the server is up but /health is not on main yet (F1-02 adds it).
              [ "$code" = 200 ] || [ "$code" = 404 ] && break
              sleep 2
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "run $run: GET /health -> $code"
            if [ "$code" != 200 ] && [ "$code" != 404 ]; then
              tail -n 60 "$data/run$run.log"
              exit 1
            fi
          done
      - name: Upload isolated SQLite startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-startup
          path: ${{ runner.temp }}/cb/run*.log
          if-no-files-found: error

  portability:
    name: portability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-sql-portability.py
