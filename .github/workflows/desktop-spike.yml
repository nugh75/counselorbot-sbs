name: desktop-spike

# Spike F0-01 (#499): Tauri shell + PyInstaller backend on macOS, Windows, Linux.
# Manual or on spike branches only: it is too heavy for every push to main.
on:
  workflow_dispatch:
  push:
    branches:
      - "spike/**"
    paths:
      - desktop/spike-tauri/**
      - .github/workflows/desktop-spike.yml

permissions:
  contents: read

concurrency:
  group: desktop-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            bundles: app,dmg
          - runner: macos-15-intel
            bundles: app,dmg
          - runner: windows-latest
            bundles: nsis,msi
          - runner: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    services:
      # Only Linux runners support service containers: the "full" check runs there.
      postgres:
        image: ${{ startsWith(matrix.runner, 'ubuntu') && 'postgres:15' || '' }}
        env:
          POSTGRES_USER: spike
          POSTGRES_PASSWORD: spike
          POSTGRES_DB: spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spike" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/spike-tauri/src-tauri
      - name: Linux system libraries for Tauri
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Package backend (PyInstaller onedir)
        run: bash desktop/spike-tauri/sidecar/build.sh | tee "$RUNNER_TEMP/pyinstaller.txt" | grep -E "seconds|onedir_mb|ERROR"

      - name: Packaged backend alone, minimal mode (SQLite, no lifespan)
        run: |
          exe=desktop/spike-tauri/src-tauri/backend/counselorbot-backend
          start=$(date +%s)
          "$exe" --port 18765 --data-dir "$RUNNER_TEMP/minimal" &
          for i in $(seq 1 300); do curl -sf -m 2 http://127.0.0.1:18765/auth/me && break; sleep 1; done
          echo; echo "ready_seconds=$(( $(date +%s) - start ))"
          curl -sf -m 60 http://127.0.0.1:18765/spike/info
          kill %1

      - name: Packaged backend alone, full mode (Postgres, real migrations)
        if: startsWith(matrix.runner, 'ubuntu')
        env:
          DATABASE_URL: postgresql://spike:spike@127.0.0.1:5432/spike
        run: |
          exe=desktop/spike-tauri/src-tauri/backend/counselorbot-backend
          start=$(date +%s)
          "$exe" --mode full --port 18766 --data-dir "$RUNNER_TEMP/full" > "$RUNNER_TEMP/full.log" 2>&1 &
          for i in $(seq 1 600); do curl -sf -m 2 http://127.0.0.1:18766/auth/me && break; sleep 1; done
          echo; echo "ready_seconds=$(( $(date +%s) - start ))"
          curl -sf -m 5 http://127.0.0.1:18766/auth/me || { tail -40 "$RUNNER_TEMP/full.log"; exit 1; }
          kill %1
          grep -iE "error|traceback" "$RUNNER_TEMP/full.log" | head -20 || true

      - name: Build Tauri app
        working-directory: desktop/spike-tauri
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --bundles ${{ matrix.bundles }}

      - name: Artifact sizes
        run: |
          cd desktop/spike-tauri/src-tauri/target/release
          {
            echo "### ${{ matrix.runner }}"
            echo '```'
            du -sh ../../backend | sed 's/^/backend onedir: /'
            find bundle -maxdepth 2 \( -name '*.dmg' -o -name '*.app' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \) -exec du -sh {} \;
            grep -E "seconds|onedir_mb" "$RUNNER_TEMP/pyinstaller.txt"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Installed app check (macOS)
        if: startsWith(matrix.runner, 'macos')
        run: |
          app=$(find desktop/spike-tauri/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          cp -R "$app" "$RUNNER_TEMP/"
          exe="$RUNNER_TEMP/$(basename "$app")/Contents/MacOS/counselorbot-spike"
          bash desktop/spike-tauri/scripts/check-app.sh "$exe" smoke 300
          bash desktop/spike-tauri/scripts/check-app.sh "$exe" gui 300

      - name: Installed app check (Windows, NSIS per-user install)
        if: startsWith(matrix.runner, 'windows')
        run: |
          installer=$(find desktop/spike-tauri/src-tauri/target/release/bundle/nsis -name '*.exe' | head -1)
          "$installer" //S
          exe="$LOCALAPPDATA/CounselorBotSpike/counselorbot-spike.exe"
          ls -la "$(dirname "$exe")"
          bash desktop/spike-tauri/scripts/check-app.sh "$exe" smoke 300
          bash desktop/spike-tauri/scripts/check-app.sh "$exe" gui 300

      - name: Installed app check (Linux, .deb and AppImage)
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get install -y ./desktop/spike-tauri/src-tauri/target/release/bundle/deb/*.deb
          bash desktop/spike-tauri/scripts/check-app.sh /usr/bin/counselorbot-spike smoke 300 xvfb-run -a
          bash desktop/spike-tauri/scripts/check-app.sh /usr/bin/counselorbot-spike gui 300 xvfb-run -a
          appimage=$(find desktop/spike-tauri/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 bash desktop/spike-tauri/scripts/check-app.sh "$appimage" smoke 300 xvfb-run -a

      - name: Backend log on failure
        if: failure()
        run: find "$HOME" -name backend.log -path '*counselorbot.spike*' -exec tail -60 {} \; 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ matrix.runner }}
          path: |
            desktop/spike-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/spike-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop/spike-tauri/src-tauri/target/release/bundle/deb/*.deb
            ${{ runner.temp }}/spike-gui.png
          retention-days: 7
          if-no-files-found: warn
