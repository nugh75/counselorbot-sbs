name: Desktop PostgreSQL (ADR-0004)

on:
  pull_request:
    paths:
      - 'desktop/teacher/**'
      - 'resources/postgresql/**'
      - 'scripts/download-postgres-binaries.py'
      - 'scripts/tests/test_download_postgres_binaries.py'
      - '.github/workflows/desktop-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-postgres-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  download-binaries:
    name: Download PostgreSQL ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
          - target: macos-x64
            os: macos-15-intel
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test verified downloads and resource layout
        run: python -m unittest discover -s scripts/tests -p test_download_postgres_binaries.py
      - name: Stage the pinned PostgreSQL distribution
        # Linux source builds target the same glibc baseline as the .deb.
        # patchelf replaces the temporary build prefix with a relative rpath.
        if: runner.os != 'Linux'
        run: |
          python scripts/download-postgres-binaries.py --target ${{ matrix.target }} --output resources/postgresql/${{ matrix.target }}
          # A tar preserves executable permissions and shared-library symlinks.
          tar -czf postgresql-${{ matrix.target }}.tgz -C resources/postgresql/${{ matrix.target }} .
      - name: Stage PostgreSQL for Linux glibc 2.35
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python scripts/download-postgres-binaries.py --target linux-x64 --output resources/postgresql/linux-x64
          tar -czf postgresql-linux-x64.tgz -C resources/postgresql/linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql-${{ matrix.target }}
          path: postgresql-${{ matrix.target }}.tgz
          retention-days: 7

  build-shell:
    name: Shell and native PostgreSQL (${{ matrix.target }})
    needs: download-binaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/teacher/src-tauri
          cache-on-failure: true
      - name: Linux system libraries for Tauri
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v4
        with:
          name: postgresql-${{ matrix.target }}
          path: postgres-artifact
      - name: Restore PostgreSQL resource with original permissions
        run: |
          mkdir -p desktop/teacher/src-tauri/postgresql
          tar -xzf postgres-artifact/postgresql-${{ matrix.target }}.tgz -C desktop/teacher/src-tauri/postgresql
      - name: Shell formatting and unit tests
        working-directory: desktop/teacher/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked
      - name: First start, application-role SQL, stop and second start
        run: |
          cargo build --locked --manifest-path desktop/teacher/src-tauri/Cargo.toml
          exe="desktop/teacher/src-tauri/target/debug/counselorbot-teacher"
          if [ "${{ matrix.os }}" = windows-latest ]; then
            exe="$exe.exe"
            MSYS2_ARG_CONV_EXCL='*' icacls "$GITHUB_WORKSPACE/desktop/teacher/src-tauri" /grant '*S-1-5-32-545:(OI)(CI)F' /T /Q
            MSYS2_ARG_CONV_EXCL='*' icacls "$RUNNER_TEMP" /grant '*S-1-5-32-545:(OI)(CI)F' /T /Q
            bash desktop/teacher/scripts/run-windows-restricted.sh "$exe" \
              --postgres-smoke "$GITHUB_WORKSPACE/desktop/teacher/src-tauri" "$RUNNER_TEMP/cb-postgres-smoke"
          else
            "$exe" --postgres-smoke "$GITHUB_WORKSPACE/desktop/teacher/src-tauri" "$RUNNER_TEMP/cb-postgres-smoke"
          fi

  summary:
    name: Riepilogo PostgreSQL
    needs: [download-binaries, build-shell]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require every PostgreSQL platform gate
        env:
          DOWNLOAD_RESULT: ${{ needs.download-binaries.result }}
          SHELL_RESULT: ${{ needs.build-shell.result }}
        run: |
          echo "Download binaries: $DOWNLOAD_RESULT"
          echo "Shell and native PostgreSQL: $SHELL_RESULT"
          test "$DOWNLOAD_RESULT" = success
          test "$SHELL_RESULT" = success
