name: Desktop PostgreSQL (ADR-0004)

on:
  push:
    branches:
      - feature/desktop-embedded-postgresql
    paths:
      - 'desktop/teacher/**'
      - 'resources/postgresql/**'
      - 'scripts/download-postgres-binaries.py'
      - '.github/workflows/desktop-postgres.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'desktop/teacher/**'
      - 'resources/postgresql/**'
      - 'scripts/download-postgres-binaries.py'
      - '.github/workflows/desktop-postgres.yml'
  workflow_dispatch:

jobs:
  # Job 1: Download e verifica binari PostgreSQL per ogni target
  download-binaries:
    name: Download PostgreSQL ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-14
          - target: macos-x64
            os: macos-15-intel
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download PostgreSQL binaries (macOS/Windows)
        if: matrix.target != 'linux-x64'
        run: |
          python scripts/download-postgres-binaries.py \
            --target ${{ matrix.target }} \
            --output resources/postgresql/${{ matrix.target }}

      - name: Build PostgreSQL from source (Linux)
        if: matrix.target == 'linux-x64'
        run: |
          python scripts/download-postgres-binaries.py \
            --target linux-x64 \
            --output resources/postgresql/linux-x64 \
            --build-from-source

      - name: Verify binaries exist
        run: |
          ls -la resources/postgresql/${{ matrix.target }}/bin/
          test -f resources/postgresql/${{ matrix.target }}/bin/postgres || \
            (test -f resources/postgresql/${{ matrix.target }}/bin/postgres.exe && echo "Windows exe OK") || \
            (echo "ERROR: postgres binary not found" && exit 1)

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-${{ matrix.target }}
          path: resources/postgresql/${{ matrix.target }}/
          retention-days: 7

  # Job 2: Build e test del guscio Tauri con PostgreSQL
  build-shell:
    name: Build shell (${{ matrix.os }})
    needs: download-binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-22.04
            target: linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download PostgreSQL binaries
        uses: actions/download-artifact@v4
        with:
          name: postgresql-${{ matrix.target }}
          path: resources/postgresql/current

      - name: Merge binaries into resources/postgresql
        run: |
          mkdir -p resources/postgresql/bin resources/postgresql/lib resources/postgresql/share
          cp -r resources/postgresql/current/bin/* resources/postgresql/bin/ || true
          cp -r resources/postgresql/current/lib/* resources/postgresql/lib/ || true
          cp -r resources/postgresql/current/share/* resources/postgresql/share/ || true
          ls -la resources/postgresql/bin/

      - name: Cargo check
        run: cargo check --manifest-path desktop/teacher/src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path desktop/teacher/src-tauri/Cargo.toml

      - name: Cargo fmt check
        run: cargo fmt --check --manifest-path desktop/teacher/src-tauri/Cargo.toml

      - name: Build Tauri app (debug)
        run: |
          cd desktop/teacher
          npm install
          npm run tauri build -- --debug || echo "Build debug skipped (CI environment)"

  # Job 3: Smoke test - primo avvio PostgreSQL (ADR-0004 §9 gate 1-2)
  smoke-postgres:
    name: Smoke PostgreSQL (${{ matrix.os }})
    needs: build-shell
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-14
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Download PostgreSQL binaries
        uses: actions/download-artifact@v4
        with:
          name: postgresql-${{ matrix.target }}
          path: /tmp/postgresql

      - name: Test initdb + avvio + health (ADR-0004 §9 gate 1)
        run: |
          # Simula primo avvio: initdb in cartella temporanea
          export PGDATA=/tmp/pgdata-test
          rm -rf $PGDATA
          mkdir -p $PGDATA

          /tmp/postgresql/bin/initdb \
            --pgdata=$PGDATA \
            --username=counselorbot_admin \
            --auth-host=scram-sha-256 \
            --auth-local=reject \
            --locale=C \
            --encoding=UTF8 \
            --pwfile=<(echo "test-password-123")

          # Avvia postgres
          /tmp/postgresql/bin/postgres -D $PGDATA -p 55432 &
          PG_PID=$!
          sleep 2

          # Verifica pg_isready
          /tmp/postgresql/bin/pg_isready -h 127.0.0.1 -p 55432

          # Crea database e ruolo
          /tmp/postgresql/bin/psql -h 127.0.0.1 -p 55432 -U counselorbot_admin -d postgres -c \
            "CREATE ROLE counselorbot_app LOGIN PASSWORD 'app-password-123';"
          /tmp/postgresql/bin/psql -h 127.0.0.1 -p 55432 -U counselorbot_admin -d postgres -c \
            "CREATE DATABASE counselorbot OWNER counselorbot_app;"

          # Verifica connessione app
          /tmp/postgresql/bin/psql "postgresql://counselorbot_app:app-password-123@127.0.0.1:55432/counselorbot" -c "SELECT 1;"

          # Test doppio avvio (ADR-0004 §9 gate 2)
          kill $PG_PID
          wait $PG_PID || true
          sleep 1

          /tmp/postgresql/bin/postgres -D $PGDATA -p 55432 &
          PG_PID=$!
          sleep 2
          /tmp/postgresql/bin/pg_isready -h 127.0.0.1 -p 55432

          # Stop pulito
          /tmp/postgresql/bin/pg_ctl -D $PGDATA stop -m fast -w

          echo "✅ Smoke test PostgreSQL superato"

      - name: Test backend health contratto 2
        env:
          DATABASE_URL: postgresql://counselorbot_app:app-password-123@127.0.0.1:55432/counselorbot
        run: |
          # Avvia postgres per il test backend
          export PGDATA=/tmp/pgdata-test
          /tmp/postgresql/bin/postgres -D $PGDATA -p 55432 &
          sleep 2

          # Avvia backend e verifica health
          uvicorn backend.main:app --port 8099 &
          BACKEND_PID=$!
          sleep 10

          # Verifica health contratto 2
          curl -s http://127.0.0.1:8099/health | python3 -c "
          import json, sys
          h = json.load(sys.stdin)
          assert h['desktop_contract'] == 2, f'Expected contract 2, got {h[\"desktop_contract\"]}'
          assert h['db'] == 'postgresql', f'Expected postgresql, got {h[\"db\"]}'
          print('✅ Health check contratto 2 OK:', h)
          "

          kill $BACKEND_PID || true
          /tmp/postgresql/bin/pg_ctl -D $PGDATA stop -m fast -w || true

  # Job 4: Riepilogo
  summary:
    name: Riepilogo PostgreSQL
    needs: [download-binaries, build-shell, smoke-postgres]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          echo "=== Risultati PostgreSQL CI ==="
          echo "Download binaries: ${{ needs.download-binaries.result }}"
          echo "Build shell: ${{ needs.build-shell.result }}"
          echo "Smoke test: ${{ needs.smoke-postgres.result }}"
