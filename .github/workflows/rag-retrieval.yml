name: Document retrieval
on:
  push:
    paths:
      - 'backend/rag_index.py'
      - 'backend/routes/site_chat.py'
      - 'backend/routes/rag_docs.py'
      - 'backend/embedding_service.py'
      - 'backend/vision_service.py'
      - 'backend/qsa_extractor.py'
      - 'backend/ai_service.py'
      - 'backend/memory_embeddings.py'
      - 'backend/chat_preparation.py'
      - 'backend/chat_logic.py'
      - 'backend/prompt_config.py'
      - 'backend/routes/document_retrieval.py'
      - 'backend/tests/test_admin_document_retrieval.py'
      - 'backend/tests/test_embedding_provider.py'
      - 'backend/tests/test_embedding_privacy.py'
      - 'backend/tests/test_qsa_vision_fallback.py'
      - 'backend/tests/test_rag_*.py'
      - 'scripts/benchmark-rag-bm25.py'
      - '.github/workflows/rag-retrieval.yml'
  pull_request:
    paths:
      - 'backend/rag_index.py'
      - 'backend/routes/site_chat.py'
      - 'backend/routes/rag_docs.py'
      - 'backend/embedding_service.py'
      - 'backend/vision_service.py'
      - 'backend/qsa_extractor.py'
      - 'backend/ai_service.py'
      - 'backend/memory_embeddings.py'
      - 'backend/chat_preparation.py'
      - 'backend/chat_logic.py'
      - 'backend/prompt_config.py'
      - 'backend/routes/document_retrieval.py'
      - 'backend/tests/test_admin_document_retrieval.py'
      - 'backend/tests/test_embedding_provider.py'
      - 'backend/tests/test_embedding_privacy.py'
      - 'backend/tests/test_qsa_vision_fallback.py'
      - 'backend/tests/test_rag_*.py'
      - 'scripts/benchmark-rag-bm25.py'
      - '.github/workflows/rag-retrieval.yml'
permissions:
  contents: read
jobs:
  offline-retrieval:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'sqlite:///:memory:'
      DATA_DIR: '/tmp/rag-test-data'
      SESSION_MEMORY_DIR: '/tmp/rag-test-memory'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff mypy
      - name: Lint changed retrieval code
        run: >-
          ruff check --select F backend/rag_index.py backend/routes/site_chat.py
          backend/routes/rag_docs.py backend/routes/document_retrieval.py backend/tests/test_admin_document_retrieval.py backend/tests/test_rag_bm25.py
          backend/tests/test_rag_embedding_degradation.py backend/tests/test_rag_index_versions.py backend/embedding_service.py
          backend/vision_service.py backend/qsa_extractor.py backend/ai_service.py
          backend/memory_embeddings.py backend/tests/test_embedding_provider.py
          backend/tests/test_embedding_privacy.py
          backend/tests/test_qsa_vision_fallback.py scripts/benchmark-rag-bm25.py
      - run: mypy --explicit-package-bases --follow-imports=silent --ignore-missing-imports backend/rag_index.py backend/embedding_service.py backend/vision_service.py backend/routes/document_retrieval.py
      - name: Offline regression tests (fake embedders)
        run: >-
          python -m pytest backend/tests/test_admin_document_retrieval.py backend/tests/test_embedding_privacy.py backend/tests/test_embedding_provider.py backend/tests/test_rag_bm25.py
          backend/tests/test_rag_embedding_degradation.py backend/tests/test_rag_index_versions.py backend/tests/test_rag_markdown.py
          backend/tests/test_qsa_vision_fallback.py -q --disable-warnings
