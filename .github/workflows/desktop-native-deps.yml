name: desktop-native-deps

# F1-04 (#499): external programs of the backend on the desktop platforms.
# Checks runtime detection and degradation without Graphviz, the bundled
# Windows Graphviz and the PyMuPDF page rasterizer that replaced Poppler.
# Manual or on F1-04 branches only: not needed on every push to main.
on:
  workflow_dispatch:
  push:
    branches:
      - "feature/f1-04-**"

permissions:
  contents: read

concurrency:
  group: desktop-native-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-arm64
            graphviz: none
          - runner: macos-15-intel
            platform: macos-x64
            graphviz: none
          - runner: windows-latest
            platform: windows-x64
            graphviz: bundled
          - runner: ubuntu-22.04
            platform: linux-x64
            graphviz: none
          - runner: ubuntu-22.04
            platform: linux-x64
            graphviz: apt
    name: backend (${{ matrix.platform }}, graphviz ${{ matrix.graphviz }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Hide a preinstalled Graphviz
        if: matrix.graphviz == 'none'
        run: |
          for dir in $(dirname "$(command -v dot 2>/dev/null)" 2>/dev/null) /opt/homebrew/bin /usr/local/bin /usr/bin; do
            [ -e "$dir/dot" ] && sudo mv "$dir/dot" "$dir/dot.hidden" && echo "hidden $dir/dot"
          done
          ! command -v dot
      - name: Install Graphviz with apt
        if: matrix.graphviz == 'apt'
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Fetch the bundled Graphviz
        if: matrix.graphviz == 'bundled'
        run: |
          bash desktop/native-deps/fetch-graphviz.sh ${{ matrix.platform }} "$RUNNER_TEMP/native"
          echo "NATIVE_BIN_DIR=$(cygpath -w "$RUNNER_TEMP/native/bin")" >> "$GITHUB_ENV"
      - name: Report capabilities
        run: |
          python - <<'EOF'
          import json
          from backend.native_deps import find_program, native_capabilities
          caps = native_capabilities()
          print(json.dumps({"dot": find_program("dot"), **caps}, indent=2))
          expected = "${{ matrix.graphviz }}" != "none"
          assert caps["diagrams"]["available"] is expected, caps
          EOF
      - name: Native dependency tests
        run: python -m pytest -q -rs -p no:cacheprovider backend/tests/test_native_deps.py

  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run i18n:check
      - run: npx eslint src/components/ui/DiagramBlock.tsx src/lib/i18n-diagram.ts
