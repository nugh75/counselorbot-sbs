<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <!-- Sfondo pulito -->
  <rect width="400" height="400" fill="#ffffff" />

  <!-- Card principale del libretto / piano d'azione -->
  <g filter="drop-shadow(0 8px 24px rgba(15, 23, 42, 0.08))">
    <rect x="50" y="45" width="300" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

    <!-- Segnalibro / Nastro superiore Ocra -->
    <path d="M 285 45 L 285 78 L 297 70 L 309 78 L 309 45 Z" fill="#c9711f" />

    <!-- Intestazione del libretto -->
    <rect x="80" y="75" width="130" height="10" rx="5" fill="#155e63" />
    <rect x="80" y="93" width="80" height="6" rx="3" fill="#cbd5e1" />

    <!-- Box metriche di avanzamento (quadrante di progresso) -->
    <g transform="translate(80, 118)">
      <rect x="0" y="0" width="240" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      <!-- Indicatore circolare di progresso (Gauge) -->
      <circle cx="36" cy="30" r="18" stroke="#e2e8f0" stroke-width="4.5" fill="none" />
      <path d="M 36 12 A 18 18 0 1 1 20 38" stroke="#155e63" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <circle cx="20" cy="38" r="3" fill="#c9711f" />
      <!-- Barre di sintesi obiettivo -->
      <rect x="68" y="20" width="100" height="7" rx="3.5" fill="#334155" />
      <rect x="68" y="33" width="140" height="6" rx="3" fill="#94a3b8" />
    </g>

    <!-- Checklist dei compiti operativi (Action Items con checkbox) -->
    <g transform="translate(80, 196)">
      <!-- Task 1: Completato -->
      <rect x="0" y="0" width="20" height="20" rx="5" fill="#155e63" />
      <path d="M 5 10 L 9 14 L 15 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="30" y="7" width="170" height="6" rx="3" fill="#64748b" />

      <!-- Task 2: Completato -->
      <rect x="0" y="32" width="20" height="20" rx="5" fill="#155e63" />
      <path d="M 5 42 L 9 46 L 15 38" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="30" y="39" width="150" height="6" rx="3" fill="#64748b" />

      <!-- Task 3: In corso (bordo ocra) -->
      <rect x="0" y="64" width="20" height="20" rx="5" fill="#fdf6ed" stroke="#c9711f" stroke-width="2" />
      <circle cx="10" cy="74" r="3" fill="#c9711f" />
      <rect x="30" y="71" width="180" height="6" rx="3" fill="#c9711f" opacity="0.9" />
    </g>

    <!-- Mini timeline / Tappe verso il traguardo in fondo -->
    <g transform="translate(80, 310)">
      <!-- Linea di collegamento -->
      <line x1="20" y1="18" x2="200" y2="18" stroke="#e2e8f0" stroke-width="2" />
      <line x1="20" y1="18" x2="140" y2="18" stroke="#155e63" stroke-width="2" />
      <!-- Nodi milestone -->
      <circle cx="20" cy="18" r="6" fill="#155e63" />
      <circle cx="80" cy="18" r="6" fill="#155e63" />
      <circle cx="140" cy="18" r="7" fill="#c9711f" />
      <circle cx="140" cy="18" r="3" fill="#ffffff" />
      <circle cx="200" cy="18" r="6" stroke="#cbd5e1" stroke-width="2" fill="#ffffff" />
      <!-- Bandierina traguardo finale sopra il nodo finale -->
      <line x1="200" y1="18" x2="200" y2="0" stroke="#c9711f" stroke-width="2" />
      <polygon points="200,0 214,5 200,10" fill="#c9711f" />
    </g>
  </g>
</svg>
