<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <!-- Sfondo pulito -->
  <rect width="400" height="400" fill="#ffffff" />

  <!-- Card principale del questionario con ombra delicata -->
  <g filter="drop-shadow(0 8px 24px rgba(15, 23, 42, 0.08))">
    <rect x="50" y="45" width="300" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

    <!-- Clip superiore della cartella -->
    <rect x="150" y="35" width="100" height="20" rx="6" fill="#155e63" />
    <circle cx="200" cy="45" r="4" fill="#ffffff" opacity="0.8" />

    <!-- Intestazione scheda: barra titolo e barra categoria -->
    <rect x="80" y="78" width="140" height="10" rx="5" fill="#155e63" />
    <rect x="80" y="96" width="90" height="6" rx="3" fill="#cbd5e1" />

    <!-- Riga 1: Domanda con scala di valutazione Likert a 4 opzioni -->
    <g transform="translate(80, 122)">
      <rect x="0" y="0" width="180" height="6" rx="3" fill="#94a3b8" />
      <g transform="translate(0, 14)">
        <!-- Opzione 1 -->
        <circle cx="12" cy="12" r="10" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" />
        <!-- Opzione 2 -->
        <circle cx="52" cy="12" r="10" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" />
        <!-- Opzione 3 (Selezionata - Petrolio) -->
        <circle cx="92" cy="12" r="11" fill="#155e63" />
        <circle cx="92" cy="12" r="4" fill="#ffffff" />
        <!-- Opzione 4 -->
        <circle cx="132" cy="12" r="10" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" />
      </g>
    </g>

    <!-- Separatore delicato -->
    <line x1="80" y1="168" x2="320" y2="168" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Riga 2: Seconda domanda -->
    <g transform="translate(80, 180)">
      <rect x="0" y="0" width="150" height="6" rx="3" fill="#94a3b8" />
      <g transform="translate(0, 14)">
        <!-- Opzione 1 -->
        <circle cx="12" cy="12" r="10" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" />
        <!-- Opzione 2 -->
        <circle cx="52" cy="12" r="10" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" />
        <!-- Opzione 3 -->
        <circle cx="92" cy="12" r="10" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" />
        <!-- Opzione 4 (Selezionata con accento Ocra) -->
        <circle cx="132" cy="12" r="11" fill="#c9711f" />
        <circle cx="132" cy="12" r="4" fill="#ffffff" />
      </g>
    </g>

    <!-- Separatore delicato -->
    <line x1="80" y1="226" x2="320" y2="226" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Riga 3: Terza domanda -->
    <g transform="translate(80, 238)">
      <rect x="0" y="0" width="190" height="6" rx="3" fill="#94a3b8" />
      <g transform="translate(0, 14)">
        <!-- Opzione 1 -->
        <circle cx="12" cy="12" r="10" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" />
        <!-- Opzione 2 (Selezionata - Petrolio) -->
        <circle cx="52" cy="12" r="11" fill="#155e63" />
        <circle cx="52" cy="12" r="4" fill="#ffffff" />
        <!-- Opzione 3 -->
        <circle cx="92" cy="12" r="10" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" />
        <!-- Opzione 4 -->
        <circle cx="132" cy="12" r="10" stroke="#cbd5e1" stroke-width="2" fill="#f8fafc" />
      </g>
    </g>

    <!-- Barra di avanzamento e pulsante avanti in fondo -->
    <g transform="translate(80, 310)">
      <!-- Barra progresso -->
      <rect x="0" y="8" width="160" height="8" rx="4" fill="#f1f5f9" />
      <rect x="0" y="8" width="120" height="8" rx="4" fill="#155e63" />
      <!-- Pulsante Avanti circolare -->
      <circle cx="215" cy="12" r="18" fill="#155e63" />
      <path d="M 211 7 L 217 12 L 211 17" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
