<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bg_davide" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="70%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </radialGradient>
    <!-- Blocco 1 (Base teal chiaro) -->
    <linearGradient id="b1_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="b1_front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <!-- Blocco 2 (Intermedio petrol) -->
    <linearGradient id="b2_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="b2_front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <!-- Blocco 3 (Azione ambra/arancio) -->
    <linearGradient id="b3_top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="b3_front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Base medaglione -->
  <circle cx="50" cy="50" r="48" fill="url(#bg_davide)" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35" />

  <!-- Arco / ponte dinamico verso l'azione -->
  <path d="M 22 75 C 32 50, 52 35, 76 28" fill="none" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.6" />
  <path d="M 76 28 L 73 34 M 76 28 L 69 29" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Blocco 1: Base operativa (sinistra-basso) -->
  <g>
    <!-- Lato superiore -->
    <polygon points="30,58 45,51 45,61 30,68" fill="#115e59" opacity="0.4" />
    <path d="M 20 62 L 34 55 L 48 62 L 34 69 Z" fill="url(#b1_top)" />
    <!-- Lato sinistro frontale -->
    <path d="M 20 62 L 34 69 L 34 81 L 20 74 Z" fill="url(#b1_front)" />
    <!-- Lato destro frontale -->
    <path d="M 34 69 L 48 62 L 48 74 L 34 81 Z" fill="#0f766e" />
  </g>

  <!-- Blocco 2: Costruzione intermedia (centro) -->
  <g>
    <path d="M 36 48 L 50 41 L 64 48 L 50 55 Z" fill="url(#b2_top)" />
    <path d="M 36 48 L 50 55 L 50 67 L 36 60 Z" fill="url(#b2_front)" />
    <path d="M 50 55 L 64 48 L 64 60 L 50 67 Z" fill="#042f2e" opacity="0.8" />
  </g>

  <!-- Blocco 3: Traguardo dell'azione (alto a destra, accento arancio vibrante) -->
  <g>
    <path d="M 52 34 L 66 27 L 80 34 L 66 41 Z" fill="url(#b3_top)" />
    <path d="M 52 34 L 66 41 L 66 53 L 52 46 Z" fill="url(#b3_front)" />
    <path d="M 66 41 L 80 34 L 80 46 L 66 53 Z" fill="#c2410c" />
  </g>

  <!-- Scintilla di concretezza e slancio sopra il blocco finale -->
  <circle cx="66" cy="18" r="3.5" fill="#fef3c7" />
  <circle cx="66" cy="18" r="2" fill="#f97316" />
  <line x1="66" y1="11" x2="66" y2="14" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" />
  <line x1="71" y1="14" x2="69" y2="16" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" />
  <line x1="61" y1="14" x2="63" y2="16" stroke="#fed7aa" stroke-width="1.5" stroke-linecap="round" />
</svg>