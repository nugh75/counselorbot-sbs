<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bg_elena" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="70%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </radialGradient>
    <linearGradient id="arm_left_elena" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="arm_right_elena" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="heart_core_elena" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Base medaglione -->
  <circle cx="50" cy="50" r="48" fill="url(#bg_elena)" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35" />

  <!-- Onde concentriche di empatia e accoglienza -->
  <circle cx="50" cy="48" r="38" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="2 4" opacity="0.3" />
  <circle cx="50" cy="48" r="32" fill="none" stroke="#99f6e4" stroke-width="1" opacity="0.2" />

  <!-- Sagoma abbraccio / cuore empatico -->
  <!-- Braccio avvolgente sinistro -->
  <path d="M 50 78 C 34 70, 20 54, 22 38 C 24 24, 39 22, 47 32 C 50 35, 50 38, 50 42 C 48 36, 42 32, 35 34 C 28 36, 28 47, 36 57 C 42 64, 48 69, 50 78 Z" fill="url(#arm_left_elena)" />

  <!-- Braccio avvolgente destro (incrocio morbido protettivo) -->
  <path d="M 50 78 C 66 70, 80 54, 78 38 C 76 24, 61 22, 53 32 C 50 35, 50 38, 50 42 C 52 36, 58 32, 65 34 C 72 36, 72 47, 64 57 C 58 64, 52 69, 50 78 Z" fill="url(#arm_right_elena)" opacity="0.95" />

  <!-- Forma interna: cuore di calore ed ascolto sincero -->
  <path d="M 50 46 C 47 40, 40 40, 38 45 C 36 50, 42 56, 50 64 C 58 56, 64 50, 62 45 C 60 40, 53 40, 50 46 Z" fill="url(#heart_core_elena)" />
  <circle cx="45" cy="45" r="1.5" fill="#fef3c7" opacity="0.9" />

  <!-- Scintilla di serenità e presenza accogliente -->
  <circle cx="50" cy="22" r="2.5" fill="#fef3c7" />
  <circle cx="50" cy="22" r="1.3" fill="#f97316" />
</svg>