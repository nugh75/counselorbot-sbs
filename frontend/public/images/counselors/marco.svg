<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bg_marco" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="70%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </radialGradient>
    <linearGradient id="scope_body_marco" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="beam_discovery" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="discovery_star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Base medaglione -->
  <circle cx="50" cy="50" r="48" fill="url(#bg_marco)" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35" />

  <!-- Curve di livello e meridiani della mappa di esplorazione -->
  <path d="M 12 72 C 30 65, 45 78, 65 70 C 78 65, 85 70, 90 74" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="2 3" opacity="0.4" />
  <path d="M 16 82 C 35 75, 55 86, 75 80 C 84 78, 88 80, 92 84" fill="none" stroke="#5eead4" stroke-width="1" stroke-dasharray="2 3" opacity="0.3" />
  <circle cx="50" cy="50" r="38" fill="none" stroke="#99f6e4" stroke-width="0.8" stroke-dasharray="1 5" opacity="0.3" />

  <!-- Fascio di osservazione / scoperta che esce dal cannocchiale -->
  <polygon points="56,44 76,20 84,28 62,50" fill="url(#beam_discovery)" />

  <!-- Astro / Isola di Scoperta all'orizzonte (punto focale arancio caldo) -->
  <g transform="translate(80, 24)">
    <circle cx="0" cy="0" r="6" fill="#f97316" opacity="0.3" />
    <path d="M 0,-7 Q 0,0 7,0 Q 0,0 0,7 Q 0,0 -7,0 Q 0,0 0,-7 Z" fill="url(#discovery_star)" />
    <circle cx="0" cy="0" r="2" fill="#fef3c7" />
  </g>

  <!-- Cannocchiale telescopico orientato a 45 gradi (verso l'alto-destra) -->
  <g transform="rotate(-45 50 50)">
    <!-- Oculare (sezione più piccola in basso) -->
    <rect x="47" y="66" width="6" height="8" rx="1.5" fill="#ccfbf1" />
    <rect x="45.5" y="72" width="9" height="3" rx="1.5" fill="#042f2e" />

    <!-- Tubo 1 (sezione intermedia inferiore) -->
    <rect x="46" y="52" width="8" height="15" rx="1.5" fill="url(#scope_body_marco)" />
    <line x1="46" y1="53" x2="54" y2="53" stroke="#ccfbf1" stroke-width="1" />

    <!-- Tubo 2 (sezione intermedia superiore) -->
    <rect x="44" y="36" width="12" height="17" rx="2" fill="#0d9488" />
    <rect x="43" y="50" width="14" height="3" rx="1" fill="#f97316" />

    <!-- Tubo principale / Obiettivo (sezione ampia) -->
    <rect x="42" y="20" width="16" height="17" rx="2.5" fill="url(#scope_body_marco)" />
    <!-- Ghiera metallica e lente frontale -->
    <rect x="40.5" y="17" width="19" height="4" rx="2" fill="#5eead4" />
    <ellipse cx="50" cy="17" rx="7" ry="2" fill="#fed7aa" />
  </g>

  <!-- Coordinate / mirino di precisione metodica -->
  <line x1="72" y1="24" x2="88" y2="24" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
  <line x1="80" y1="16" x2="80" y2="32" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
</svg>