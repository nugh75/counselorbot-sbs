<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bg_luca" cx="55%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="70%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </radialGradient>
    <linearGradient id="thread_grad_luca" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="spark_luca" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Base medaglione -->
  <circle cx="50" cy="50" r="48" fill="url(#bg_luca)" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35" />

  <!-- Nodi e linee guida logiche di sottofondo -->
  <circle cx="34" cy="62" r="14" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="2 3" opacity="0.35" />
  <circle cx="72" cy="32" r="18" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="3 4" opacity="0.25" />

  <!-- Il filo che si dipana (dalla complessità alla chiarezza logica) -->
  <!-- Matassa / anello morbido a sinistra -->
  <path d="M 22 64 C 20 54, 30 46, 38 52 C 44 56, 44 68, 34 72 C 26 74, 24 64, 30 58 C 36 52, 46 54, 52 48 L 68 34" fill="none" stroke="url(#thread_grad_luca)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Nodo di connessione analitica al centro del percorso -->
  <circle cx="38" cy="52" r="2.5" fill="#5eead4" />
  <circle cx="52" cy="48" r="2.5" fill="#ccfbf1" />

  <!-- La Scintilla di Intuizione (Eureka!) all'estremità della chiarezza -->
  <g transform="translate(70, 32)">
    <!-- Alone caldo -->
    <circle cx="0" cy="0" r="10" fill="#f97316" opacity="0.2" />
    <!-- Stella a 4 punte di intuizione logica -->
    <path d="M 0,-15 Q 0,0 15,0 Q 0,0 0,15 Q 0,0 -15,0 Q 0,0 0,-15 Z" fill="url(#spark_luca)" />
    <!-- Faccetta centrale luminosa -->
    <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#fef3c7" />
    <!-- Punto luce puro -->
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>

  <!-- Piccole scintille logiche secondarie -->
  <circle cx="82" cy="18" r="1.5" fill="#fed7aa" />
  <circle cx="58" cy="22" r="1.2" fill="#ffffff" />
</svg>