<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bg_sara" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </radialGradient>
    <linearGradient id="beam_sara" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#fed7aa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="star_gold_sara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Base medaglione -->
  <circle cx="50" cy="50" r="48" fill="url(#bg_sara)" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35" />

  <!-- Fascio di luce proiettato dal faro verso il cielo futuro -->
  <polygon points="34,45 88,10 94,42 36,51" fill="url(#beam_sara)" />

  <!-- Onde alla base del promontorio -->
  <path d="M 12 84 C 20 80, 28 86, 36 83 C 44 80, 52 86, 60 83 C 68 80, 76 86, 88 83" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 18 90 C 26 87, 34 93, 42 90 C 50 87, 58 93, 66 90 C 74 87, 82 93, 90 90" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Scogliera / base d'appoggio in basso a sinistra -->
  <path d="M 18 85 L 44 85 L 42 78 L 22 78 Z" fill="#042f2e" />

  <!-- Torre del faro stilizzata -->
  <!-- Base e corpo conico a fasce alternate -->
  <polygon points="26,78 36,78 34,51 28,51" fill="#e9f2f2" />
  <!-- Fascia petrolio sul fusto -->
  <polygon points="27,69 35,69 34.5,60 27.5,60" fill="#0d9488" />

  <!-- Balcone e cupola del faro -->
  <rect x="26" y="49" width="10" height="2.5" rx="1" fill="#042f2e" />
  <!-- Cupola superiore -->
  <path d="M 28 44 C 28 40, 34 40, 34 44 Z" fill="#0f766e" />

  <!-- Lanterna luminosa calda ardente -->
  <rect x="28" y="44" width="6" height="5" fill="#f97316" />
  <circle cx="31" cy="46.5" r="1.5" fill="#ffffff" />

  <!-- LA STELLA GUIDA (Stella polare di orientamento al futuro) -->
  <g transform="translate(74, 25)">
    <!-- Alone stella -->
    <circle cx="0" cy="0" r="14" fill="#fb923c" opacity="0.18" />
    <!-- Stella a 8 punte -->
    <!-- 4 punte cardinali lunghe -->
    <path d="M 0,-13 Q 0,0 13,0 Q 0,0 0,13 Q 0,0 -13,0 Q 0,0 0,-13 Z" fill="url(#star_gold_sara)" />
    <!-- 4 punte diagonali intermedie -->
    <path d="M -6,-6 Q 0,0 6,-6 Q 0,0 6,6 Q 0,0 -6,6 Q 0,0 -6,-6 Z" fill="#fed7aa" />
    <!-- Nucleo candido centrale -->
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Piccole stelle secondarie nel cielo -->
  <circle cx="58" cy="18" r="1.2" fill="#ccfbf1" opacity="0.8" />
  <circle cx="86" cy="46" r="1" fill="#fed7aa" opacity="0.8" />
  <circle cx="48" cy="30" r="1" fill="#ffffff" opacity="0.7" />
</svg>