<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bg_class_sports" cx="35%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="45%" stop-color="#042f2e" />
      <stop offset="85%" stop-color="#021c1b" />
      <stop offset="100%" stop-color="#011211" />
    </radialGradient>
    <linearGradient id="torch_handle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="40%" stop-color="#b45309" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="flame_outer" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="flame_inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="track_lane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg_class_sports)" />

  <!-- Pista di atletica in prospettiva dinamica dal basso a destra verso il centro -->
  <g fill="none">
    <!-- Corsia esterna 3 -->
    <path d="M 320 180 C 230 180, 140 160, 90 120 C 60 96, 50 70, 70 50 C 90 30, 140 25, 200 30" stroke="#0f766e" stroke-width="14" opacity="0.4" />
    <path d="M 320 180 C 230 180, 140 160, 90 120 C 60 96, 50 70, 70 50 C 90 30, 140 25, 200 30" stroke="#2dd4bf" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.6" />

    <!-- Corsia intermedia 2 -->
    <path d="M 320 156 C 240 156, 160 140, 115 106 C 90 86, 82 66, 96 52 C 110 38, 150 34, 200 38" stroke="#115e59" stroke-width="14" opacity="0.4" />
    <path d="M 320 156 C 240 156, 160 140, 115 106 C 90 86, 82 66, 96 52 C 110 38, 150 34, 200 38" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="5 3" opacity="0.75" />

    <!-- Corsia interna 1 (cordolo) -->
    <path d="M 320 132 C 250 132, 180 120, 140 92 C 120 76, 114 62, 122 54 C 130 46, 160 43, 200 46" stroke="#134e4a" stroke-width="14" opacity="0.5" />
    <path d="M 320 132 C 250 132, 180 120, 140 92 C 120 76, 114 62, 122 54 C 130 46, 160 43, 200 46" stroke="#fde68a" stroke-width="2" opacity="0.85" />
  </g>

  <!-- Linea di traguardo geometrica a scacchi stilizzati sul rettilineo -->
  <g transform="translate(240, 112) rotate(-22)" opacity="0.8">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 4" />
    <line x1="3" y1="0" x2="3" y2="60" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4" stroke-dashoffset="4" />
  </g>

  <!-- Traiettoria parabolica ed energia cinetica (Arco di slancio) -->
  <path d="M 20 145 Q 110 40 220 35 T 310 70" fill="none" stroke="url(#track_lane)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="220" cy="35" r="3.5" fill="#5eead4" />
  <circle cx="220" cy="35" r="7" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Fiaccola olimpica ed elegante in primo piano a sinistra -->
  <g id="olympic_torch" transform="translate(68, 70) rotate(16)">
    <!-- Impugnatura e fusto della fiaccola in ottone cesellato -->
    <path d="M -7 55 L -10 15 L -18 -8 C -18 -12, 18 -12, 18 -8 L 10 15 L 7 55 Z" fill="url(#torch_handle)" stroke="#78350f" stroke-width="1.5" />
    <!-- Anelli ornamentali sul fusto -->
    <line x1="-9" y1="24" x2="9" y2="24" stroke="#fde68a" stroke-width="2" />
    <line x1="-8" y1="38" x2="8" y2="38" stroke="#fde68a" stroke-width="2" />
    <!-- Pomolo alla base della fiaccola -->
    <circle cx="0" cy="58" r="7" fill="url(#torch_handle)" stroke="#78350f" stroke-width="1" />
    <!-- Braciere superiore / calotta della torcia -->
    <path d="M -20 -8 C -22 -15, 22 -15, 20 -8 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1" />

    <!-- Fiamma stilizzata a strati dinamici -->
    <!-- Fiamma esterna arancio/corallo -->
    <path d="M -16 -12 C -24 -35, -8 -55, -2 -75 C 10 -58, 22 -45, 16 -12 Z" fill="url(#flame_outer)" opacity="0.9" />
    <!-- Fiamma intermedia dorata -->
    <path d="M -10 -12 C -16 -28, -4 -42, 0 -58 C 8 -44, 16 -34, 10 -12 Z" fill="url(#flame_inner)" />
    <!-- Nucleo centrale bianco/luce pura -->
    <path d="M -5 -12 C -8 -22, -2 -32, 0 -42 C 4 -32, 8 -24, 5 -12 Z" fill="#ffffff" />
    <!-- Scintille di fuoco che salgono in alto a destra -->
    <circle cx="4" cy="-80" r="2.2" fill="#fbbf24" />
    <circle cx="12" cy="-90" r="1.5" fill="#fde68a" />
    <circle cx="8" cy="-68" r="1.8" fill="#ea580c" />
  </g>
</svg>
