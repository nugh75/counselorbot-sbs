<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bg_class_music" cx="45%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="45%" stop-color="#0f766e" />
      <stop offset="85%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021c1b" />
    </radialGradient>
    <linearGradient id="brass_fork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="wave_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="wave_amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg_class_music)" />

  <!-- Pentagramma musicale curvo e flessuoso di fondo -->
  <g stroke="#14b8a6" stroke-width="0.75" fill="none" opacity="0.25">
    <path d="M 0 50 Q 80 40 160 55 T 320 45" />
    <path d="M 0 60 Q 80 50 160 65 T 320 55" />
    <path d="M 0 70 Q 80 60 160 75 T 320 65" />
    <path d="M 0 80 Q 80 70 160 85 T 320 75" />
    <path d="M 0 90 Q 80 80 160 95 T 320 85" />
  </g>

  <!-- Onde sinusoidali acustiche di risonanza armonica -->
  <path d="M 0 120 Q 40 70 80 120 T 160 120 T 240 120 T 320 120" fill="none" stroke="url(#wave_cyan)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 0 120 Q 40 160 80 120 T 160 120 T 240 120 T 320 120" fill="none" stroke="url(#wave_amber)" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
  <path d="M 0 125 Q 20 105 40 125 T 80 125 T 120 125 T 160 125 T 200 125 T 240 125 T 280 125 T 320 125" fill="none" stroke="#2dd4bf" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.3" />

  <!-- Grande Diapason risonante a 440 Hz in ottone e cromo a sinistra -->
  <g id="tuning_fork" transform="translate(100, 95) rotate(-18)">
    <!-- Onde sferiche di risonanza emesse dai rebbi del diapason -->
    <path d="M -24 -65 A 35 35 0 0 1 24 -65" fill="none" stroke="#5eead4" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6" />
    <path d="M -32 -75 A 50 50 0 0 1 32 -75" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="3 4" opacity="0.4" />

    <!-- Rebbio sinistro -->
    <line x1="-12" y1="-60" x2="-12" y2="0" stroke="url(#brass_fork)" stroke-width="5" stroke-linecap="round" />
    <!-- Rebbio destro -->
    <line x1="12" y1="-60" x2="12" y2="0" stroke="url(#brass_fork)" stroke-width="5" stroke-linecap="round" />
    <!-- Arco di curvatura di base a U -->
    <path d="M -12 0 C -12 16, 12 16, 12 0" fill="none" stroke="url(#brass_fork)" stroke-width="5" />
    <!-- Stelo / manico centrale -->
    <line x1="0" y1="12" x2="0" y2="52" stroke="url(#brass_fork)" stroke-width="5" stroke-linecap="round" />
    <!-- Sfera terminale del manico -->
    <circle cx="0" cy="54" r="5" fill="url(#brass_fork)" stroke="#78350f" stroke-width="1" />
  </g>

  <!-- Note e figure armoniche vettoriali che danzano sulle frequenze a destra -->
  <g transform="translate(225, 65)">
    <!-- Coppia di crome unite da legatura dorata -->
    <g transform="translate(0, 0)">
      <!-- Testa della nota 1 -->
      <ellipse cx="0" cy="30" rx="7" ry="5" transform="rotate(-20 0 30)" fill="#fbbf24" stroke="#78350f" stroke-width="1" />
      <line x1="6" y1="28" x2="6" y2="-8" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round" />
      <!-- Testa della nota 2 -->
      <ellipse cx="28" cy="22" rx="7" ry="5" transform="rotate(-20 28 22)" fill="#fbbf24" stroke="#78350f" stroke-width="1" />
      <line x1="34" y1="20" x2="34" y2="-16" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round" />
      <!-- Barra trasversale di legatura -->
      <polygon points="5,-11 35,-19 35,-13 5,-5" fill="url(#brass_fork)" />
    </g>

    <!-- Semiminima isolata con coda morbida -->
    <g transform="translate(56, 14)">
      <ellipse cx="0" cy="20" rx="6.5" ry="4.5" transform="rotate(-20 0 20)" fill="#2dd4bf" stroke="#0f766e" stroke-width="1" />
      <line x1="5.5" y1="18" x2="5.5" y2="-12" stroke="#5eead4" stroke-width="2" stroke-linecap="round" />
      <!-- Coda svolazzante della croma -->
      <path d="M 5.5 -12 C 12 -8, 16 2, 14 6" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Piccola nota sospesa brillante -->
    <g transform="translate(-45, -20)">
      <ellipse cx="0" cy="10" rx="4.5" ry="3.5" transform="rotate(-20 0 10)" fill="#fef3c7" />
      <line x1="4" y1="9" x2="4" y2="-10" stroke="#fef3c7" stroke-width="1.5" />
    </g>
  </g>

  <!-- Particelle armoniche e scintillii di frequenza -->
  <g fill="#fde68a">
    <circle cx="160" cy="40" r="1.8" />
    <circle cx="185" cy="52" r="1.5" />
    <circle cx="140" cy="80" r="2" fill="#5eead4" />
    <circle cx="280" cy="140" r="1.5" />
  </g>
</svg>
