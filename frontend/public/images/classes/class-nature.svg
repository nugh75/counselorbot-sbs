<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bg_class_nature" cx="60%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021c1b" />
    </radialGradient>
    <linearGradient id="stem_nature" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gold_nature" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="canopy_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#047857" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg_class_nature)" />

  <!-- Profilo collinare del suolo e sezioni pedologiche -->
  <path d="M 0 152 Q 90 138 180 150 T 320 144 L 320 180 L 0 180 Z" fill="#021c1b" opacity="0.9" />
  <path d="M 0 160 Q 80 148 160 158 T 320 154" fill="none" stroke="#047857" stroke-width="1.5" opacity="0.5" />

  <!-- Reticolo di radici profonde che si diramano nella terra -->
  <g stroke="url(#gold_nature)" stroke-width="1.2" fill="none" opacity="0.45" stroke-linecap="round">
    <path d="M 90 150 Q 85 160 70 168 Q 60 172 45 174" />
    <path d="M 90 150 Q 95 162 105 170 Q 115 174 130 176" />
    <path d="M 88 158 Q 80 166 84 176" stroke-width="0.8" />
  </g>

  <!-- Chioma arborea stilizzata a cerchi geometrici a destra (Albero della Crescita) -->
  <g transform="translate(235, 75)">
    <!-- Cerchi concentrici traslucidi della chioma arborea -->
    <circle cx="0" cy="0" r="54" fill="url(#canopy_grad)" stroke="#34d399" stroke-width="0.8" stroke-dasharray="3 4" />
    <circle cx="0" cy="0" r="40" fill="#047857" fill-opacity="0.3" stroke="#10b981" stroke-width="1.2" />
    <circle cx="0" cy="0" r="26" fill="#065f46" fill-opacity="0.5" stroke="#6ee7b7" stroke-width="1.5" />
    <!-- Tronco e rami a biforcazione in ottone naturale -->
    <path d="M 0 75 L 0 15" stroke="url(#gold_nature)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 0 15 Q -14 0 -24 -12" fill="none" stroke="url(#gold_nature)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 0 15 Q 14 0 24 -12" fill="none" stroke="url(#gold_nature)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 0 15 L 0 -18" fill="none" stroke="url(#gold_nature)" stroke-width="2" stroke-linecap="round" />
    <!-- Foglie geometriche sui rami -->
    <ellipse cx="-24" cy="-12" rx="6" ry="3.5" transform="rotate(-30 -24 -12)" fill="#34d399" />
    <ellipse cx="24" cy="-12" rx="6" ry="3.5" transform="rotate(30 24 -12)" fill="#34d399" />
    <ellipse cx="0" cy="-18" rx="6" ry="3.5" fill="#fde68a" />
  </g>

  <!-- Germoglio vitale in primo piano a sinistra che nasce dal suolo -->
  <g transform="translate(90, 80)">
    <!-- Stelo curvo e flessibile -->
    <path d="M 0 70 Q -4 40 8 18 Q 14 6 22 0" fill="none" stroke="url(#stem_nature)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Prima foglia spiegata a sinistra (con venature geometriche in oro) -->
    <g transform="translate(6, 24) rotate(-35)">
      <path d="M 0 0 C -25 -10, -45 5, -55 28 C -35 32, -15 22, 0 0 Z" fill="#047857" stroke="#34d399" stroke-width="1.2" />
      <path d="M 0 0 C -25 -10, -45 5, -55 28" fill="none" stroke="url(#gold_nature)" stroke-width="1.8" />
      <!-- Nervature secondarie -->
      <line x1="-15" y1="5" x2="-22" y2="-2" stroke="#fde68a" stroke-width="1" />
      <line x1="-28" y1="12" x2="-38" y2="4" stroke="#fde68a" stroke-width="1" />
      <line x1="-40" y1="20" x2="-48" y2="14" stroke="#fde68a" stroke-width="1" />
    </g>

    <!-- Seconda foglia emergente a destra -->
    <g transform="translate(18, 8) rotate(25)">
      <path d="M 0 0 C 22 -8, 42 4, 50 26 C 32 30, 14 20, 0 0 Z" fill="#10b981" stroke="#6ee7b7" stroke-width="1.2" />
      <path d="M 0 0 C 22 -8, 42 4, 50 26" fill="none" stroke="url(#gold_nature)" stroke-width="1.8" />
      <!-- Nervature secondarie -->
      <line x1="14" y1="5" x2="20" y2="-2" stroke="#fde68a" stroke-width="1" />
      <line x1="26" y1="11" x2="35" y2="4" stroke="#fde68a" stroke-width="1" />
      <line x1="38" y1="19" x2="45" y2="13" stroke="#fde68a" stroke-width="1" />
    </g>

    <!-- Terza fogliolina apicale nascente in cima -->
    <ellipse cx="23" cy="-3" rx="7" ry="3.5" transform="rotate(-65 23 -3)" fill="#fde68a" stroke="#d97706" stroke-width="0.8" />

    <!-- Goccia di rugiada lucente con riflesso di luce solare -->
    <ellipse cx="2" cy="18" rx="3.5" ry="5" fill="#ccfbf1" opacity="0.9" />
    <circle cx="1" cy="16" r="1.2" fill="#ffffff" />
  </g>

  <!-- Cerchi d'aria e fotosintesi luminosa nell'atmosfera -->
  <g fill="#a7f3d0" opacity="0.7">
    <circle cx="140" cy="50" r="2" />
    <circle cx="165" cy="38" r="1.5" />
    <circle cx="152" cy="68" r="2.2" fill="#fde68a" />
    <circle cx="178" cy="58" r="1.8" />
  </g>
</svg>
