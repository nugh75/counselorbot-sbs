<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bg_class_humanities" cx="40%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021c1b" />
    </radialGradient>
    <linearGradient id="parchment_humanities" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="gold_humanities" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="column_humanities" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg_class_humanities)" />

  <!-- Geometrie classiche di sfondo: archi e proporzioni armoniche -->
  <g stroke="#2dd4bf" stroke-width="0.8" opacity="0.2" fill="none">
    <path d="M 20 160 C 20 80, 80 20, 160 20 C 240 20, 300 80, 300 160" />
    <path d="M 40 160 C 40 95, 95 40, 160 40 C 225 40, 280 95, 280 160" stroke-dasharray="3 4" />
    <line x1="160" y1="20" x2="160" y2="160" stroke-dasharray="2 4" />
    <line x1="20" y1="160" x2="300" y2="160" />
  </g>

  <!-- Colonna classica ionica a destra -->
  <g transform="translate(242, 22)">
    <!-- Capitello ionico con volute -->
    <rect x="0" y="8" width="56" height="7" rx="1.5" fill="#fef3c7" opacity="0.85" />
    <!-- Volute sinistra e destra -->
    <path d="M 6 8 C 0 8, -4 16, 2 22 C 8 26, 14 20, 12 15 C 10 11, 4 12, 5 16" fill="none" stroke="url(#gold_humanities)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 50 8 C 56 8, 60 16, 54 22 C 48 26, 42 20, 44 15 C 46 11, 52 12, 51 16" fill="none" stroke="url(#gold_humanities)" stroke-width="2.5" stroke-linecap="round" />
    <rect x="8" y="16" width="40" height="6" fill="#fef08a" opacity="0.8" />
    <!-- Fusto scanalato della colonna -->
    <rect x="12" y="24" width="32" height="118" fill="url(#column_humanities)" stroke="#5eead4" stroke-width="0.8" />
    <!-- Scanalature verticali della colonna -->
    <line x1="18" y1="24" x2="18" y2="142" stroke="#0f766e" stroke-width="1.2" opacity="0.4" />
    <line x1="24" y1="24" x2="24" y2="142" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
    <line x1="30" y1="24" x2="30" y2="142" stroke="#0f766e" stroke-width="1.2" opacity="0.4" />
    <line x1="36" y1="24" x2="36" y2="142" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
    <!-- Base della colonna -->
    <rect x="8" y="142" width="40" height="6" fill="#fef08a" opacity="0.8" />
    <rect x="2" y="148" width="52" height="8" rx="1.5" fill="#fef3c7" opacity="0.85" />
  </g>

  <!-- Pergamena classica aperta orizzontalmente al centro-sinistra -->
  <g transform="translate(68, 92) rotate(-6)">
    <rect x="0" y="0" width="130" height="60" rx="3" fill="url(#parchment_humanities)" stroke="#b45309" stroke-width="1.2" />
    <!-- Rotoli di pergamena arrotolati ai lati -->
    <rect x="-5" y="-2" width="6" height="64" rx="2.5" fill="#78350f" />
    <rect x="129" y="-2" width="6" height="64" rx="2.5" fill="#78350f" />
    <!-- Righe simboliche di testo manoscritto antico senza lettere -->
    <line x1="14" y1="14" x2="114" y2="14" stroke="#78350f" stroke-width="2" stroke-dasharray="10 3 6 4 14 3" opacity="0.45" stroke-linecap="round" />
    <line x1="14" y1="24" x2="110" y2="24" stroke="#78350f" stroke-width="2" stroke-dasharray="8 4 12 3 9 4" opacity="0.45" stroke-linecap="round" />
    <line x1="14" y1="34" x2="116" y2="34" stroke="#78350f" stroke-width="2" stroke-dasharray="12 3 7 4 10 3" opacity="0.45" stroke-linecap="round" />
    <line x1="14" y1="44" x2="80" y2="44" stroke="#78350f" stroke-width="2" stroke-dasharray="9 3 14 4" opacity="0.45" stroke-linecap="round" />
    <!-- Sigillo di ceralacca in basso a destra -->
    <circle cx="104" cy="45" r="7" fill="#b91c1c" />
    <circle cx="104" cy="45" r="4.5" fill="#dc2626" />
    <polygon points="104,42 106,46 102,46" fill="#fef2f2" opacity="0.7" />
  </g>

  <!-- Pila di tomi e libri antichi rilegati in primo piano a sinistra -->
  <g transform="translate(32, 114)">
    <!-- Libro grande alla base (verde petrolio scuro con costola dorata) -->
    <rect x="0" y="24" width="118" height="18" rx="2.5" fill="#042f2e" stroke="#134e4a" stroke-width="1.2" />
    <rect x="3" y="26" width="6" height="14" rx="1" fill="url(#gold_humanities)" />
    <line x1="16" y1="26" x2="16" y2="40" stroke="#f59e0b" stroke-width="1.5" />
    <line x1="20" y1="26" x2="20" y2="40" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Pagine del libro inferiore -->
    <rect x="110" y="27" width="6" height="12" fill="#fef3c7" />

    <!-- Libro intermedio (bordeaux / ambra caldo) -->
    <g transform="translate(10, 8)">
      <rect x="0" y="0" width="102" height="17" rx="2" fill="#78350f" stroke="#92400e" stroke-width="1" />
      <line x1="12" y1="2" x2="12" y2="15" stroke="#fbbf24" stroke-width="1.2" />
      <line x1="16" y1="2" x2="16" y2="15" stroke="#fbbf24" stroke-width="1.2" />
      <!-- Segnalibro a nastro dorato che pende -->
      <path d="M 60 8 C 65 18, 62 30, 70 38 L 74 34 L 78 38 C 72 28, 70 18, 64 8 Z" fill="url(#gold_humanities)" />
    </g>

    <!-- Libro superiore inclinato -->
    <g transform="translate(18, -6) rotate(4)">
      <rect x="0" y="0" width="88" height="15" rx="2" fill="#0f766e" stroke="#14b8a6" stroke-width="1" />
      <rect x="2" y="2" width="5" height="11" rx="0.8" fill="url(#gold_humanities)" />
      <!-- Fregio dorato al centro del piatto -->
      <polygon points="46,4 49,7.5 46,11 43,7.5" fill="url(#gold_humanities)" />
    </g>
  </g>

  <!-- Ramoscello d'alloro o piuma d'oca calamaio in alto al centro -->
  <g transform="translate(150, 48) rotate(35)">
    <!-- Cannello e stelo della piuma -->
    <path d="M 0 50 Q 8 20 28 0" fill="none" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" />
    <!-- Vessillo della penna stilizzata in ciano e oro -->
    <path d="M 28 0 Q 22 14 16 32 C 14 36, 6 42, 2 46 Q 6 36 10 26 Q 16 12 28 0 Z" fill="#ccfbf1" opacity="0.75" />
    <path d="M 28 0 Q 30 16 26 30 C 24 34, 18 40, 14 44 Q 18 34 22 24 Q 26 12 28 0 Z" fill="#fbbf24" opacity="0.6" />
    <polygon points="-1,52 3,48 0,55" fill="#f59e0b" />
  </g>
</svg>
