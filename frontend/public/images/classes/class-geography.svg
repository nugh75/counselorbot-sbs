<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bg_class_geography" cx="40%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="90%" stop-color="#021c1b" />
      <stop offset="100%" stop-color="#011615" />
    </radialGradient>
    <linearGradient id="brass_globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="sea_globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#bg_class_geography)" />

  <!-- Linee lossodromiche e rotte nautiche di fondo -->
  <g stroke="#2dd4bf" stroke-width="0.75" opacity="0.22" fill="none">
    <!-- Raggi di navigazione convergenti -->
    <line x1="240" y1="90" x2="0" y2="20" stroke-dasharray="3 4" />
    <line x1="240" y1="90" x2="0" y2="90" stroke-dasharray="3 4" />
    <line x1="240" y1="90" x2="0" y2="160" stroke-dasharray="3 4" />
    <line x1="240" y1="90" x2="120" y2="0" stroke-dasharray="3 4" />
    <line x1="240" y1="90" x2="120" y2="180" stroke-dasharray="3 4" />
    <circle cx="240" cy="90" r="70" stroke-dasharray="2 5" />
  </g>

  <!-- Grande Mappamondo nautico da tavolo a sinistra/centro -->
  <g id="desktop_globe" transform="translate(105, 88)">
    <!-- Base circolare del mappamondo in legno tornito e ottone -->
    <ellipse cx="0" cy="74" rx="34" ry="7" fill="#042f2e" stroke="#78350f" stroke-width="1.5" />
    <ellipse cx="0" cy="72" rx="28" ry="5.5" fill="url(#brass_globe)" />
    <!-- Colonna e stelo centrale di supporto -->
    <rect x="-4" y="52" width="8" height="20" rx="2" fill="url(#brass_globe)" stroke="#78350f" stroke-width="1" />
    <circle cx="0" cy="52" r="6" fill="url(#brass_globe)" stroke="#78350f" stroke-width="1" />

    <!-- Semimeridiano graduato in ottone a 23.5 gradi di inclinazione -->
    <g transform="rotate(23.5)">
      <!-- Arco esterno in ottone -->
      <path d="M 0 -58 A 58 58 0 0 1 0 58" fill="none" stroke="url(#brass_globe)" stroke-width="5" stroke-linecap="round" />
      <path d="M 0 -58 A 58 58 0 0 1 0 58" fill="none" stroke="#78350f" stroke-width="1" stroke-linecap="round" opacity="0.6" />
      <!-- Perni polari nord e sud -->
      <rect x="-3" y="-62" width="6" height="6" rx="1" fill="#fbbf24" />
      <rect x="-3" y="56" width="6" height="6" rx="1" fill="#fbbf24" />

      <!-- Sfera terrestre del globo -->
      <circle cx="0" cy="0" r="48" fill="url(#sea_globe)" stroke="#0f766e" stroke-width="1.5" />

      <!-- Sagome stilizzate dei continenti in terraferma ambra/verde -->
      <!-- Eurasia / Africa -->
      <path d="M -8 -30 C -2 -34, 15 -28, 20 -15 C 24 -2, 14 10, 6 20 C -2 24, -12 18, -10 6 C -8 -4, -14 -12, -18 -18 Z" fill="#134e4a" opacity="0.9" />
      <path d="M -22 -15 C -18 -24, -5 -22, -8 -15 C -10 -8, -25 -6, -22 -15 Z" fill="#f59e0b" opacity="0.75" />
      <!-- Americhe / Oceania accennate -->
      <path d="M -34 -25 C -28 -28, -24 -15, -30 0 C -34 10, -32 26, -26 32 C -32 30, -40 18, -38 0 Z" fill="#134e4a" opacity="0.85" />
      <path d="M 18 18 C 24 16, 32 20, 28 26 C 24 30, 16 24, 18 18 Z" fill="#f59e0b" opacity="0.7" />

      <!-- Meridiani e paralleli dorati incisi sulla sfera -->
      <g stroke="#fde68a" stroke-width="0.8" fill="none" opacity="0.55">
        <!-- Equatore -->
        <ellipse cx="0" cy="0" rx="48" ry="12" />
        <!-- Tropici e circoli -->
        <ellipse cx="0" cy="-24" rx="41.5" ry="9" stroke-dasharray="2 3" />
        <ellipse cx="0" cy="24" rx="41.5" ry="9" stroke-dasharray="2 3" />
        <!-- Meridiani ellittici -->
        <ellipse cx="0" cy="0" rx="22" ry="48" />
        <line x1="0" y1="-48" x2="0" y2="48" />
      </g>
    </g>
  </g>

  <!-- Rosa dei venti classica (Compass Rose) a destra -->
  <g id="compass_rose" transform="translate(245, 90)">
    <!-- Quadrante circolare della bussola nautica -->
    <circle cx="0" cy="0" r="42" fill="#042f2e" stroke="url(#brass_globe)" stroke-width="2.5" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="2 4" opacity="0.6" />
    <circle cx="0" cy="0" r="32" fill="#021c1b" />

    <!-- 8 punte cardinali e intercardinali della rosa dei venti -->
    <!-- Punte intercardinali (minori in oro tenue) -->
    <g transform="rotate(45)" fill="url(#brass_globe)" opacity="0.75">
      <polygon points="0,0 -4,-8 0,-26 4,-8" />
      <polygon points="0,0 -4,8 0,26 4,8" />
      <polygon points="0,0 -8,-4 -26,0 -8,4" />
      <polygon points="0,0 8,-4 26,0 8,4" />
    </g>

    <!-- Punte cardinali principali (Nord, Sud, Est, Ovest) -->
    <!-- Sud, Est, Ovest in oro/ottone -->
    <polygon points="0,0 -6,10 0,34 6,10" fill="url(#brass_globe)" stroke="#78350f" stroke-width="0.8" />
    <polygon points="0,0 10,-6 34,0 10,6" fill="url(#brass_globe)" stroke="#78350f" stroke-width="0.8" />
    <polygon points="0,0 -10,-6 -34,0 -10,6" fill="url(#brass_globe)" stroke="#78350f" stroke-width="0.8" />

    <!-- Punta Nord magnetica distintiva in rosso/arancio vivo con giglio/freccia -->
    <polygon points="0,0 -6,-10 0,-35 0,0" fill="#ea580c" stroke="#9a3412" stroke-width="0.8" />
    <polygon points="0,0 0,-35 6,-10 0,0" fill="#f97316" stroke="#9a3412" stroke-width="0.8" />
    <!-- Giglio stilizzato a Nord -->
    <circle cx="0" cy="-35" r="2.5" fill="#fef3c7" />

    <!-- Borchia centrale in ottone e gemma di zaffiro/rubino -->
    <circle cx="0" cy="0" r="7" fill="url(#brass_globe)" stroke="#78350f" stroke-width="1.2" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
</svg>
